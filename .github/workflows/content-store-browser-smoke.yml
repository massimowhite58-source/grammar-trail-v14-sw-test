name: Content Store browser smoke tests

on:
  push:
    branches: ["feature/content-library-v1"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  content-store-browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Playwright and Chromium
        run: |
          npm init -y
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: Serve repository over HTTP
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/grammar-trail-http.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8000/core/content-store-browser-test.html > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/grammar-trail-http.log
          exit 1
      - name: Run Content Store persistence checks in Chromium
        run: node core/content-store-browser-smoke.test.cjs
