name: Core and Content Library tests

on:
  push:
    branches:
      - feature/content-library-v1
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Run deterministic core tests
        run: |
          node --test \
            core/learning-core.test.mjs \
            core/content-runtime.test.mjs \
            core/task-runtime.test.mjs \
            core/recovery-runtime.test.mjs \
            core/integration.test.mjs \
            core/content-library.test.mjs \\
            core/content-store.test.mjs
